<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background square: near-black brand colour -->
  <rect width="32" height="32" fill="#09090b"/>

  <!--
    "R" lettermark for RARE — vintage-inspired, geometric, premium.
    Drawn with clean paths: straight vertical stem + curved bowl + angled leg.
    Colour: brand accent orange #f97316 on near-black #09090b.
  -->

  <!-- Vertical stem -->
  <rect x="8" y="7" width="3.5" height="18" rx="0.5" fill="#f97316"/>

  <!-- Bowl top bar -->
  <rect x="8" y="7" width="11" height="3" rx="0.5" fill="#f97316"/>

  <!-- Bowl middle bar -->
  <rect x="8" y="15" width="10" height="3" rx="0.5" fill="#f97316"/>

  <!-- Bowl right curve (rounded cap on right of bowl) -->
  <path d="M 19 7 Q 24 7 24 11.5 Q 24 16 19 18 L 19 15 Q 20.5 15 20.5 11.5 Q 20.5 10 19 10 Z" fill="#f97316"/>

  <!-- Leg: diagonal from mid-right down to bottom-right -->
  <path d="M 18.5 18 L 24 25 L 20.5 25 L 15 18 Z" fill="#f97316"/>
</svg>
